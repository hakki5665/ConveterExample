databaseChangeLog:
  - changeSet:
      id: 1
      author: hakki
      changes:
        - createTable:
            tableName: inbox
            columns:
              - column:
                  name: message_id
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: "PENDING"
        - createTable:
            tableName: outbox
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message_id
                  type: VARCHAR(255)
              - column:
                  name: payload
                  type: TEXT
              - column:
                  name: topic
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: "PENDING"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: published_at
                  type: TIMESTAMP