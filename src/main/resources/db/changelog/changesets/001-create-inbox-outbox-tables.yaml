databaseChangeLog:
  - changeSet:
      id: 1
      author: student
      changes:
        - createTable:
            tableName: inbox
            columns:
              - column:
                  name: message_id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: processed_at
                  type: timestamp
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: PENDING

        - createTable:
            tableName: outbox
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message_id
                  type: varchar(255)
              - column:
                  name: payload
                  type: text
              - column:
                  name: topic
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: PENDING
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: published_at
                  type: timestamp